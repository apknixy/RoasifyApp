<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roasify Super App</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script src="ads.js"></script>

    <style>
        body { background-color: #000; color: #fff; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent;}
        .hide { display: none !important; }
        .gradient-bg { background: linear-gradient(to bottom right, #f58529, #dd2a7b); }
        .ad-container { min-height: 50px; background: #111; display: flex; justify-content: center; align-items: center; border-top: 1px solid #222; border-bottom: 1px solid #222; margin-bottom: 16px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="absolute inset-0 z-50 bg-black flex flex-col items-center justify-center">
        <div class="w-24 h-24 rounded-full gradient-bg flex items-center justify-center mb-6 shadow-xl">
            <span class="text-white text-5xl font-bold">R</span>
        </div>
        <h1 class="text-4xl font-bold text-white mb-2">Roasify</h1>
        <p class="text-gray-400 mb-10 text-sm">Business, Jobs & Social App</p>
        
        <button onclick="signInWithGoogle()" class="bg-blue-600 text-white px-8 py-3 rounded-lg shadow-md font-bold text-lg flex items-center gap-3">
            <i class="fa-brands fa-google"></i> SIGN IN WITH GOOGLE
        </button>
        <p id="loginError" class="text-red-500 mt-4 text-xs font-bold"></p>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div id="mainApp" class="hide h-full flex flex-col">
        
        <header class="flex justify-between items-center p-4 border-b border-gray-800 bg-black z-10">
            <h1 id="headerTitle" class="text-2xl font-bold">Roasify</h1>
            <div class="flex gap-4 text-2xl">
                <i class="fa-solid fa-crown text-yellow-500 cursor-pointer" onclick="buyPremium()" title="Upgrade to VIP"></i>
                <i class="fa-regular fa-paper-plane"></i>
            </div>
        </header>

        <!-- Dynamic Feed Container -->
        <main id="feedContainer" class="flex-1 overflow-y-auto pb-20 scrollbar-hide">
            <!-- JavaScript yahan posts aur ads daalega -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="flex justify-around items-center p-3 bg-black border-t border-gray-800 fixed bottom-0 w-full text-2xl z-20 pb-4">
            <i class="fa-solid fa-house text-white cursor-pointer"></i>
            <i class="fa-solid fa-magnifying-glass text-gray-500 cursor-pointer"></i>
            <i class="fa-regular fa-square-plus text-pink-500 cursor-pointer"></i>
            <i class="fa-solid fa-briefcase text-gray-500 cursor-pointer" onclick="alert('Jobs Portal coming soon!')"></i>
            <div class="w-8 h-8 rounded-full border-2 border-gray-500 bg-gray-800 flex justify-center items-center cursor-pointer" onclick="logout()">
                <span id="navAvatar" class="text-xs font-bold text-white">U</span>
            </div>
        </nav>
    </div>

    <script>
        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCatxgsLqijsj1o1BXTrJqAST02lPWa4SY",
            authDomain: "roasify-2b050.firebaseapp.com",
            databaseURL: "https://roasify-2b050-default-rtdb.firebaseio.com",
            projectId: "roasify-2b050"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUserPremiumStatus = "false";
        let currentUserName = "User";

        auth.onAuthStateChanged((user) => {
            if (user) {
                db.ref('Users/' + user.uid).on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        document.getElementById('loginScreen').classList.add('hide');
                        document.getElementById('mainApp').classList.remove('hide');
                        
                        currentUserName = data.name;
                        document.getElementById('navAvatar').innerText = currentUserName.charAt(0).toUpperCase();

                        currentUserPremiumStatus = data.VIP_Star || "false";
                        if(currentUserPremiumStatus === "true"){
                            document.getElementById('headerTitle').innerHTML = 'Roasify <i class="fa-solid fa-star text-yellow-500 text-sm"></i>';
                        }
                        
                        // Start Background Ads
                        initAllAds(currentUserPremiumStatus);
                        
                        // Generate Dynamic Feed
                        generateDynamicFeed();
                    }
                });
            } else {
                document.getElementById('loginScreen').classList.remove('hide');
                document.getElementById('mainApp').classList.add('hide');
            }
        });

        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then((result) => {
                db.ref('Users/' + result.user.uid).update({
                    name: result.user.displayName,
                    email: result.user.email,
                    accountType: "User Account",
                    VIP_Star: "false"
                });
            }).catch(err => console.log(err));
        }

        function logout() {
            if(confirm("Logout karna chahte hain?")) auth.signOut();
        }

        function buyPremium() {
            alert("Razorpay Integration Coming Next! \nUpgrade to VIP Star for ₹699/month to remove all Ads and get unlimited storage.");
        }

        // ==========================================
        // 🔥 DYNAMIC FEED & SCROLL ADS GENERATOR
        // ==========================================
        function generateDynamicFeed() {
            const feedContainer = document.getElementById('feedContainer');
            feedContainer.innerHTML = ''; // Pehle ka sab clear karo

            // Dummy posts data (Baad mein ye Database se aayega)
            const dummyPosts = [
                { name: "Rohit Sharma", text: "Match ready! 🏏", likes: "1.2M" },
                { name: "Neha_Tech", text: "Building my first PWA app 💻", likes: "450" },
                { name: "Business_Hub", text: "We are hiring! 5 Vacancies available.", likes: "89" },
                { name: currentUserName, text: "Just joined Roasify Super App!", likes: "12" }
            ];

            let adSlotCounter = 1;

            dummyPosts.forEach((post, index) => {
                let initial = post.name.charAt(0).toUpperCase();
                
                // HTML for single post
                let postHTML = `
                <article class="w-full mb-4 border-b border-gray-800 pb-4">
                    <div class="flex justify-between items-center p-3">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full gradient-bg flex items-center justify-center font-bold">${initial}</div>
                            <span class="font-bold text-sm">${post.name}</span>
                        </div>
                        <i class="fa-solid fa-ellipsis text-gray-400"></i>
                    </div>
                    
                    <div class="w-full h-80 bg-gray-900 flex items-center justify-center border-y border-gray-800 cursor-pointer relative" onclick="if(currentUserPremiumStatus !== 'true') openSmartLinkAd()">
                        <span class="text-gray-500 flex flex-col items-center text-center px-4">
                            <i class="fa-solid fa-image text-4xl mb-2"></i>
                            [ Image / Video Area ]
                        </span>
                    </div>

                    <div class="flex justify-between p-3 text-2xl">
                        <div class="flex gap-4">
                            <i class="fa-regular fa-heart text-white hover:text-red-500 cursor-pointer"></i>
                            <i class="fa-regular fa-comment text-white cursor-pointer"></i>
                        </div>
                        <i class="fa-regular fa-bookmark text-white cursor-pointer"></i>
                    </div>
                    
                    <div class="px-3">
                        <p class="font-bold text-sm">${post.likes} likes</p>
                        <p class="text-sm mt-1"><span class="font-bold">${post.name}</span> ${post.text}</p>
                    </div>
                </article>`;
                
                feedContainer.innerHTML += postHTML;

                // Har 2 post ke baad ek Ad Container laga do (Sirf Free users ke liye)
                if ((index + 1) % 2 === 0 && currentUserPremiumStatus !== "true") {
                    let adId = 'in-feed-ad-' + adSlotCounter;
                    feedContainer.innerHTML += `<div id="${adId}" class="ad-container w-full text-center"></div>`;
                    adSlotCounter++;
                }
            });

            // Post render hone ke baad, un ad containers mein Fallback Ads load karna
            if (currentUserPremiumStatus !== "true") {
                for(let i = 1; i < adSlotCounter; i++) {
                    loadInFeedAdWithFallback('in-feed-ad-' + i);
                }
            }
        }
    </script>
</body>
</html>
